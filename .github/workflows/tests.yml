name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and pipeline tests
        run: python -m pytest -q
      - name: Griffith benchmark of the FFM kernel
        run: |
          python scripts/make_cases.py --benchmark
          python scripts/benchmark_griffith.py
        env:
          MPLBACKEND: Agg
